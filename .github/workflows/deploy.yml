name: CI/CD - Weekly Report Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and Test
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-backend
          path: target/*.jar

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: weekly-report-backend
          path: target

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/Weekly_Report_dashboard_backend/target/"
          strip_components: 1
          overwrite: true

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_KEY
          script: |
            if [ -n "$GEMINI_KEY" ]; then
              echo "Configuring GEMINI_API_KEY in systemd override..."
              sudo mkdir -p /etc/systemd/system/weekly-report.service.d
              printf '[Service]\nEnvironment="GEMINI_API_KEY=%s"\n' "$GEMINI_KEY" | sudo tee /etc/systemd/system/weekly-report.service.d/override.conf
              sudo systemctl daemon-reload
            fi

            echo "=== Systemd Service Definition ==="
            sudo systemctl cat weekly-report

            LATEST_JAR=$(find /home/ubuntu -name "*.jar" -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -1 | awk '{print $2}')
            echo "Latest JAR found: $LATEST_JAR"

            if [ -n "$LATEST_JAR" ]; then
              find /home/ubuntu -maxdepth 3 -type d -name "target" -exec cp -fv "$LATEST_JAR" {}/ \;
            fi

            sudo systemctl restart weekly-report
            sleep 5
            sudo systemctl status weekly-report --no-pager
