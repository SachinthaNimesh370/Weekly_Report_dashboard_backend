name: CI/CD - Weekly Report Backend

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and Test
        run: |
          chmod +x mvnw
          ./mvnw clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-backend
          path: target/*.jar

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: weekly-report-backend
          path: target

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ubuntu/Weekly_Report_dashboard_backend/target/"
          strip_components: 1
          overwrite: true

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -d "/home/ubuntu/Weekly_Report_dashboard_backend/target/target" ]; then
              cp -fv /home/ubuntu/Weekly_Report_dashboard_backend/target/target/*.jar /home/ubuntu/Weekly_Report_dashboard_backend/target/
            fi
            sudo systemctl restart weekly-report
            sleep 5
            sudo systemctl status weekly-report --no-pager
